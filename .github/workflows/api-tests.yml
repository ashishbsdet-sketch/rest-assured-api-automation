name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rest Assured regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run TestNG suite
        id: api_tests
        continue-on-error: true
        env:
          BASE_URL: https://jsonplaceholder.typicode.com
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Publish test counts
        id: test_summary
        if: always()
        run: python3 .github/scripts/publish_test_summary.py

      - name: Upload TestNG results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-results-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail workflow when tests fail
        if: steps.api_tests.outcome == 'failure'
        run: |
          echo "::error title=Regression failed::${{ steps.test_summary.outputs.failed }} failed, ${{ steps.test_summary.outputs.passed }} passed"
          exit 1
